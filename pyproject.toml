[project]
name = "data-platform"
version = "0.1.0"
description = "The data platform for American Beauty Institute."
authors = [
    {name = "Kim, Andrew", email = "andrewkimka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagster>=1.12.22",
    "dagster-dbt>=0.29.12",
    "dagster-dlt>=0.29.12",
    "dagster-gcp>=0.28.22",
    "dagster-graphql>=1.12.22",
    "dbt-bigquery>=1.9",
    "dlt[bigquery,parquet]>=1.28.1",
    "facebook-business>=25.0.1",
    "fastapi>=0.115.0",
    "google-ads>=28.2.0",
    "google-analytics-data>=0.19.0",
    "google-api-python-client>=2.185.0",
    "google-auth>=2.41.1",
    "google-cloud-secret-manager>=2.27.0",
    "pydantic-settings>=2.9.0",
    "stripe>=15.0.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "coverage>=7.9.1",
    "dagster-dg-cli>=1.13.12",
    "dagster-webserver>=1.12.22",
    "dlt[duckdb]>=1.28.1",
    "httpx>=0.28.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.0",
    "ty>=0.0.29",
]

[tool.coverage.run]
branch = true
source = ["data-platform"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
unsafe-fixes = true

lint.select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "D",     # pydocstyle
  "PL",    # pylint-like
  "C90",   # mccabe
  "PERF",  # performance
  "RUF",   # ruff-specific
  "PTH",   # pathlib
  "FLY",   # f-strings
]

lint.ignore = []

exclude = ["tests/data", ".venv", "build", "dist"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # or "numpy" or "pep257"
