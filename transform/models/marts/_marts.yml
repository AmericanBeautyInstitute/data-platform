version: 2

models:
  - name: mart_enrollment__ad_attribution
    columns:
      - name: date
        data_tests: [not_null, unique]
      - name: new_enrollments
        data_tests: [not_null]
      - name: total_spend_usd
        data_tests: [not_null]
      - name: total_clicks
        data_tests: [not_null]
      - name: total_impressions
        data_tests: [not_null]
      - name: total_ad_conversions
        data_tests: [not_null]
      - name: total_paid_sessions
        data_tests: [not_null]
      - name: total_paid_page_views
        data_tests: [not_null]
  - name: mart_finance__revenue_by_payment_subject
    columns:
      - name: month
        data_tests: [not_null]
      - name: payment_source
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ["paypal", "stripe"]}
      - name: gross_revenue
        data_tests: [not_null]
      - name: total_fees
        data_tests: [not_null]
      - name: net_revenue
        data_tests: [not_null]
      - name: transaction_count
        data_tests: [not_null]
  - name: mart_inventory__stock_levels
    columns:
      - name: sku_id
        data_tests: [not_null]
